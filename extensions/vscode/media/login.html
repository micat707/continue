<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 MicatCode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #313244;
      border-radius: 16px;
      padding: 48px 40px;
      width: 360px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cdd6f4;
    }
    p {
      font-size: 14px;
      color: #a6adc8;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 12px;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #7c3aed;
      color: white;
    }
    .btn-secondary {
      background: #45475a;
      color: #cdd6f4;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #6c7086;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #45475a;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #6c7086;
      line-height: 1.6;
    }
    .footer a { color: #89b4fa; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .loading { display: none; }
    .loading.show { display: block; }
    .error { display: none; margin-top: 12px; color: #f38ba8; font-size: 13px; line-height: 1.5; }
    .error.show { display: block; }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #45475a;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <!-- TODO: 替换为 MicatCode 品牌图标 -->
      M
    </div>
    <h1>登录 MicatCode</h1>
    <p>使用 MicatCode 账户登录，<br>开始使用 AI 编程助手</p>

    <button class="btn btn-primary" id="micat-login-button" type="button">
      使用 MicatCode 账号登录
    </button>

    <div class="divider">或</div>

    <button class="btn btn-secondary" id="api-key-login-button" type="button">
      使用 API Key 登录
    </button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="status">正在登录，请稍候...</p>
    </div>
    <p class="error" id="error"></p>

    <div class="footer">
      继续即表示同意
      <a href="https://micatcode.com/terms" target="_blank">服务条款</a>
      和
      <a href="https://micatcode.com/privacy" target="_blank">隐私政策</a>
    </div>
  </div>

  <script>
    // In VS Code Webview context, communicate back via postMessage.
    // acquireVsCodeApi() is injected by the Webview runtime.
    let vscodeApi;
    try {
      vscodeApi = acquireVsCodeApi();
    } catch (error) {
      showError('登录页面未运行在 VS Code Webview 中，请关闭后重试。');
    }

    function setLoading(message) {
      document.getElementById('status').textContent = message;
      document.getElementById('loading').classList.add('show');
      document.getElementById('error').classList.remove('show');
    }

    function showError(message) {
      const error = document.getElementById('error');
      error.textContent = message;
      error.classList.add('show');
      document.getElementById('loading').classList.remove('show');
    }

    function sendLoginMessage(message) {
      if (!vscodeApi) {
        showError('无法连接到 MicatCode 扩展，请关闭登录页后重试。');
        return;
      }
      try {
        vscodeApi.postMessage(message);
      } catch (error) {
        console.error('MicatCode login message failed', error);
        showError('登录请求发送失败，请关闭登录页后重试。');
      }
    }

    document
      .getElementById('micat-login-button')
      .addEventListener('click', loginWithMicat);
    document
      .getElementById('api-key-login-button')
      .addEventListener('click', loginWithApiKey);

    function loginWithMicat() {
      setLoading('正在验证 MicatCode 账户...');

      // TODO: 接入真实后端。当前以 mock token 验证完整 Webview 登录链路。
      const mockToken = 'mock_token_' + Date.now();
      setTimeout(() => sendLoginMessage({ type: 'login', token: mockToken }), 800);
    }

    function loginWithApiKey() {
      const key = prompt('请输入您的 API Key：');
      if (!key || !key.trim()) return;
      setLoading('正在保存 API Key...');
      sendLoginMessage({ type: 'apiKey', apiKey: key.trim() });
    }
  </script>
</body>
</html>
