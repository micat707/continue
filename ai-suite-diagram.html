<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI超级套件 · 架构图</title>
<style>
  :root {
    --cyan:   #06b6d4;
    --blue:   #2f6bff;
    --mint:   #10b981;
    --violet: #7c4dff;
    --ink:    #1f2d4d;
    --sub:    #64748b;
    --bg:     #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px;
    background:
      radial-gradient(1200px 620px at 50% -12%, rgba(47,107,255,.12), transparent 60%),
      radial-gradient(900px 520px at 92% 18%, rgba(124,77,255,.09), transparent 55%),
      radial-gradient(900px 520px at 6% 82%, rgba(16,185,129,.08), transparent 55%),
      var(--bg);
    overflow-x: hidden;
  }

  /* 背景网格（浅色） */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(47,107,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,107,255,.055) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 38%, #000 32%, transparent 85%);
    pointer-events: none;
    z-index: 0;
  }

  .diagram {
    position: relative;
    z-index: 1;
    width: 720px;
    max-width: 100%;
    padding: 32px 28px 36px;
    border-radius: 28px;
    background: linear-gradient(180deg, #ffffff, #f6faff);
    border: 1px solid rgba(47,107,255,.12);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 30px 70px rgba(31,45,77,.14);
  }

  /* 入场动画 */
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .anim { opacity: 0; animation: rise .6s cubic-bezier(.22,.9,.3,1) forwards; }

  /* 顶部标题 */
  .crown {
    display: flex;
    justify-content: center;
    position: relative;
    margin-bottom: 8px;
  }
  .crown::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    width: 2px;
    height: 24px;
    transform: translateX(-50%);
    background: linear-gradient(var(--cyan), transparent);
    box-shadow: 0 0 8px rgba(6,182,212,.6);
  }
  .crown .title {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    padding: 17px 50px;
    border-radius: 18px;
    background: linear-gradient(135deg, #2f6bff 0%, #4f8bff 45%, #06b6d4 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.25) inset,
      0 10px 28px rgba(47,107,255,.4),
      0 0 36px rgba(6,182,212,.3);
    overflow: hidden;
  }
  /* 标题流光扫过 */
  .crown .title::after {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg);
    animation: sweep 4.5s ease-in-out infinite;
  }
  @keyframes sweep {
    0%, 60% { left: -60%; }
    100% { left: 160%; }
  }
  .crown .spark {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    color: #ffe27a;
    filter: drop-shadow(0 0 8px rgba(255,226,122,.95));
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1) rotate(0);opacity:1} 50%{transform:scale(1.2) rotate(15deg);opacity:.8} }

  /* 层级板块 */
  .layer {
    position: relative;
    border-radius: 20px;
    padding: 20px 22px 24px;
    margin-top: 28px;
    background: var(--fill);
    border: 1px solid var(--edge);
    box-shadow: 0 8px 24px var(--glow);
  }
  .layer.biz   { --accent: var(--blue);   --accent2:#5a8dff; --edge: rgba(47,107,255,.22);  --glow: rgba(47,107,255,.10); --fill: linear-gradient(180deg,#edf3ff,#f6f9ff); }
  .layer.dist  { --accent: var(--mint);   --accent2:#34d9a4; --edge: rgba(16,185,129,.22);  --glow: rgba(16,185,129,.10); --fill: linear-gradient(180deg,#e8fbf3,#f3fffb); }
  .layer.store { --accent: var(--violet); --accent2:#9a6bff; --edge: rgba(124,77,255,.22);  --glow: rgba(124,77,255,.10); --fill: linear-gradient(180deg,#f0ebff,#f8f5ff); }

  /* 连接线 + 流动数据点 */
  .layer::before {
    content: "";
    position: absolute;
    bottom: 100%;
    left: 50%;
    width: 2px;
    height: 28px;
    transform: translateX(-50%);
    background: linear-gradient(var(--accent), transparent);
    box-shadow: 0 0 8px var(--accent);
  }
  .layer::after {
    content: "";
    position: absolute;
    bottom: 100%;
    left: 50%;
    width: 7px; height: 7px;
    margin-left: -3.5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: flow 2.2s ease-in-out infinite;
  }
  @keyframes flow {
    0%   { transform: translateY(-26px); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: translateY(0); opacity: 0; }
  }
  .layer.biz::before, .layer.biz::after { display: none; }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 7px 18px;
    border-radius: 22px;
    margin-bottom: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 6px 16px var(--glow), 0 0 0 1px rgba(255,255,255,.3) inset;
  }
  .tag::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,.9);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

  .cards { display: grid; gap: 16px; }
  .biz   .cards { grid-template-columns: repeat(4, 1fr); }
  .dist  .cards { grid-template-columns: repeat(3, 1fr); }
  .store .cards { grid-template-columns: repeat(2, 1fr); }

  .card {
    position: relative;
    border-radius: 16px;
    padding: 22px 10px 18px;
    text-align: center;
    background: linear-gradient(180deg, #ffffff, #fcfdff);
    border: 1px solid rgba(31,45,77,.07);
    overflow: hidden;
    cursor: default;
    transition: transform .25s cubic-bezier(.22,.9,.3,1), box-shadow .25s ease, border-color .25s ease;
    box-shadow: 0 6px 18px rgba(31,45,77,.07);
  }
  /* 顶部流光条 */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  /* 角标装饰点 */
  .card::after {
    content: "";
    position: absolute;
    top: 11px; right: 11px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .35;
    transition: opacity .25s ease, transform .25s ease;
  }
  .card:hover {
    transform: translateY(-7px);
    border-color: var(--accent);
    box-shadow: 0 18px 36px var(--glow), 0 0 0 1px var(--accent) inset;
  }
  .card:hover::after { opacity: 1; transform: scale(1.6); }

  .icon {
    position: relative;
    width: 54px; height: 54px;
    border-radius: 16px;
    margin: 0 auto 14px;
    display: grid; place-items: center;
    color: #fff;
    background: linear-gradient(145deg, var(--accent2), var(--accent));
    box-shadow:
      0 8px 18px var(--glow),
      0 0 0 1px rgba(255,255,255,.4) inset,
      0 -3px 8px rgba(255,255,255,.3) inset;
    transition: transform .3s cubic-bezier(.22,.9,.3,1);
  }
  .card:hover .icon { transform: translateY(-2px) scale(1.06) rotate(-4deg); }
  .icon svg { color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.15)); }

  .card .name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: .5px;
  }

  svg { display: block; }
</style>
</head>
<body>
  <div class="diagram">

    <!-- 顶部 -->
    <div class="crown anim" style="animation-delay:.05s">
      <div class="title">
        <span class="spark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l1.8 5.6L19.5 9l-5.7 1.4L12 16l-1.8-5.6L4.5 9l5.7-1.4L12 2z"/>
          </svg>
        </span>
        AI超级套件
      </div>
    </div>

    <!-- 业务板块 -->
    <div class="layer biz anim" style="animation-delay:.18s">
      <span class="tag">业务板块</span>
      <div class="cards">
        <div class="card">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg>
          </div>
          <div class="name">AIHR扩展套件</div>
        </div>
        <div class="card">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
          </div>
          <div class="name">集团财务套件</div>
        </div>
        <div class="card">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
          </div>
          <div class="name">AI灵基</div>
        </div>
        <div class="card">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </div>
          <div class="name">AI套件</div>
        </div>
      </div>
    </div>

    <!-- 分布式技术 -->
    <div class="layer dist anim" style="animation-delay:.32s">
      <span class="tag">分布式技术</span>
      <div class="cards">
        <div class="card">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l8-4 8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 17l8 4 8-4"/></svg>
          </div>
          <div class="name">标准分应用</div>
        </div>
        <div class="card">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M6 8.5v3a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-3M12 13.5v2"/></svg>
          </div>
          <div class="name">分布式计算</div>
        </div>
        <div class="card">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg>
          </div>
          <div class="name">分布式署缓存</div>
        </div>
      </div>
    </div>

    <!-- 数据存储 -->
    <div class="layer store anim" style="animation-delay:.46s">
      <span class="tag">数据存储</span>
      <div class="cards">
        <div class="card">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
          </div>
          <div class="name">分库分表</div>
        </div>
        <div class="card">
          <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9L12 2z"/><path d="M12 2v18M4 6.5l8 4.5 8-4.5"/></svg>
          </div>
          <div class="name">多维数据库</div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
